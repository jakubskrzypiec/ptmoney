name: Fix mobile hero title
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-hero.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Fix mobile hero title alignment and clipping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          old = '''  .hero-copy h1 { max-width: none; font-size: clamp(2.15rem, 10.8vw, 4.6rem); line-height: 1; }
  .hero-copy h1 .hero-line { display: block; padding-bottom: .12em; margin: 0; }
  .hero-copy h1 .hero-line + .hero-line { margin-top: .1em; }
'''
          new = '''  .hero-copy h1 {
    max-width: none;
    font-size: clamp(2.1rem, 10.3vw, 4.4rem);
    line-height: 1;
    padding-right: .08em;
  }
  .hero-copy h1 .hero-line { display: block; padding-bottom: .12em; margin: 0; }
  .hero-copy h1 .hero-line--second { margin-left: 0; }
  .hero-copy h1 .hero-line + .hero-line { margin-top: .1em; }
'''
          if old not in s:
              raise SystemExit('Expected mobile hero CSS block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "Jakub Skrzypiec"
          git config user.email "kuba.skrzypiec5@gmail.com"
          git add styles.css
          git commit -m "P&T Money: align mobile hero title"
          git push
