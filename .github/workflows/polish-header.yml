name: Polish P&T Money header
on:
  push:
    paths:
      - '.github/workflows/polish-header.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Update header contact styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('header-shared.css')
          s = p.read_text()
          old = '''.pt-header__actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 0 0 auto;
}
.pt-header__phone {
  display: none;
  color: #1D1D1D;
  font-family: inherit;
  font-size: 15.3px;
  font-weight: 600;
  line-height: 1.62;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
}
.pt-header__phone:hover { color: #2F3FFF; }
.pt-header__phone--person {
  position: relative;
  padding-top: 11px;
}
.pt-header__phone--person::before {
  content: attr(data-label);
  position: absolute;
  top: -2px;
  left: 0;
  font-size: 9px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .62;
}
'''
          new = '''.pt-header__actions {
  display: flex;
  align-items: center;
  gap: 18px;
  flex: 0 0 auto;
}
.pt-header__phone {
  display: none;
  position: relative;
  min-height: 39px;
  align-items: flex-end;
  padding-top: 14px;
  color: #1D1D1D;
  font-family: inherit;
  font-size: 14.2px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.015em;
  text-decoration: none;
  white-space: nowrap;
  transition: color .2s ease, opacity .2s ease;
}
.pt-header__phone::before {
  position: absolute;
  top: 2px;
  left: 0;
  font-size: 8.5px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: .11em;
  text-transform: uppercase;
  opacity: .55;
}
.pt-header__phone:not(.pt-header__phone--person)::before { content: "Biuro"; }
.pt-header__phone--person::before { content: attr(data-label); }
.pt-header__phone--person {
  margin-left: 2px;
  padding-left: 19px;
}
.pt-header__phone--person::after {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 3px;
  width: 1px;
  background: currentColor;
  opacity: .22;
}
.pt-header__phone:hover { color: #2F3FFF; }
'''
          if old not in s:
              raise SystemExit('Expected header block not found')
          s = s.replace(old, new)
          s = s.replace('''@media (min-width: 1200px) {
  .pt-header__phone { display: inline-flex; }
}
''','''@media (min-width: 1200px) {
  .pt-header__phone { display: inline-flex; }
}
@media (min-width: 1200px) and (max-width: 1379px) {
  .pt-header__actions { gap: 12px; }
  .pt-header__phone { font-size: 13.4px; }
  .pt-header__phone--person { padding-left: 14px; }
  .pt-header__cta { padding-inline: 15px; }
}
''')
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "Jakub Skrzypiec"
          git config user.email "kuba.skrzypiec5@gmail.com"
          git add header-shared.css
          git commit -m "P&T Money: polish header contact block"
          git push
          git rm .github/workflows/polish-header.yml
          git commit -m "Remove temporary header workflow"
          git push
