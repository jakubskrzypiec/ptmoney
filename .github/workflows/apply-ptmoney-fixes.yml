name: "Apply P&T Money fixes"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ptmoney-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace corrected files
        shell: bash
        run: |
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            '' > /tmp/index.b64
          base64 -d /tmp/index.b64 | gzip -d > index.html
          printf '%s' \
            '' \
            '' > /tmp/kalkulator.b64
          base64 -d /tmp/kalkulator.b64 | gzip -d > kalkulator.html
          rm -f .github/workflows/apply-ptmoney-fixes.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html kalkulator.html .github/workflows/apply-ptmoney-fixes.yml
          git commit -m "P&T Money: apply remaining client corrections"
          git push origin main
