name: Clean P&T Money meta copy
on:
  push:
    paths:
      - '.github/workflows/clean-meta-copy.yml'
permissions:
  contents: write
jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update meta descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('P&amp;T Money pomaga porównać kredyty, leasing, faktoring i ubezpieczenia w całej Polsce. Zostaw kontakt — nasz zespół oddzwoni w jeden dzień roboczy.', 'P&amp;T Money pomaga porównać kredyty, leasing, faktoring i ubezpieczenia w całej Polsce. Zostaw kontakt — oddzwonimy w ciągu jednego dnia roboczego.')
          s = s.replace('Porównujemy oferty banków i instytucji finansowych. Zostaw kontakt — nasz zespół oddzwoni w jeden dzień roboczy.', 'Porównujemy oferty banków i instytucji finansowych. Zostaw kontakt — oddzwonimy w ciągu jednego dnia roboczego.')
          p.write_text(s, encoding='utf-8')

          p = Path('oferta.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Poznaj ofertę P&amp;T Money: kredyty, konsolidacja, hipoteki, finansowanie firm, leasing, faktoring, OZE i ubezpieczenia. Wsparcie zespołu na każdym etapie.', 'Poznaj ofertę P&amp;T Money: kredyty, konsolidacja, hipoteki, finansowanie firm, leasing, faktoring, OZE i ubezpieczenia. Prowadzimy Cię przez cały proces.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Jakub Skrzypiec"
          git config user.email "kuba.skrzypiec5@gmail.com"
          git add index.html oferta.html
          git commit -m "P&T Money: clean meta descriptions"
          git push
